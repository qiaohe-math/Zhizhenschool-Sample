 <title>The group law on a real elliptic curve</title>
 <desc>The curve y squared equals x cubed minus x. The chord y equals x plus one intersects at P=(-1,0), Q=(1−sqrt(2),2−sqrt(2)), and R=(1+sqrt(2),2+sqrt(2)). The reflected third point is P+Q.</desc>
